name: Fix Android campus startup
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fuorisede-evoluzione-universale
      - name: Fix unsafe campus name access
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app.js")
          source = path.read_text()
          old = "landingName=landingCampus?.name.split('·')[0].trim()"
          new = "landingName=landingCampus?.name?.split('·')[0]?.trim()||''"

          if new in source:
              print("Android campus guard already present.")
          elif old in source:
              path.write_text(source.replace(old, new, 1))
              print("Android campus guard applied.")
          else:
              raise SystemExit("Expected campus expression not found; app.js was not changed.")
          PY
      - name: Commit source fix when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix empty campus name crash on Android"
          git push origin HEAD:fuorisede-evoluzione-universale
