name: Fix Android campus startup
on:
  push:
    branches:
      - fuorisede-evoluzione-universale
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fuorisede-evoluzione-universale
      - name: Fix unsafe campus name access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = "landingName=landingCampus?.name.split('·')[0].trim()"
          new = "landingName=landingCampus?.name?.split('·')[0]?.trim()||''"
          if old not in s:
              raise SystemExit('Target expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Fix empty campus name crash on Android"
          git push origin HEAD:fuorisede-evoluzione-universale
