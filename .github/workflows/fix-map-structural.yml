name: Structural mobile map fix
on:
  push:
    branches: [fuorisede-evoluzione-universale]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js directly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          marker='/* STRUCTURAL MOBILE MAP FIX 20260828 */'
          if marker in s:
              raise SystemExit(0)
          s += r'''

/* STRUCTURAL MOBILE MAP FIX 20260828 */
(function(){
  const mobile=()=>matchMedia('(max-width:700px),(pointer:coarse)').matches;
  const previousInit=initMap;
  initMap=function(id='demo-map',items=state.items,attempt=0){
    previousInit(id,items,attempt);
    if(!mobile())return;
    let tries=0;
    const timer=setInterval(()=>{
      const c=activeMapMarkers.get(id);
      if(!c){if(++tries>40)clearInterval(timer);return}
      clearInterval(timer);
      const map=c.map;
      const groups=[];
      c.markers.forEach(entry=>{
        const ll=entry.marker.getLatLng();
        let g=groups.find(q=>map.distance(q.base,ll)<22);
        if(!g){g={base:ll,items:[]};groups.push(g)}
        g.items.push(entry);
      });
      groups.forEach(g=>{
        if(g.items.length<2)return;
        const cp=map.latLngToLayerPoint(g.base),n=g.items.length;
        g.items.forEach((entry,i)=>{
          const a=(Math.PI*2*i/n)-Math.PI/2;
          entry.marker.setLatLng(map.layerPointToLatLng(L.point(cp.x+Math.cos(a)*24,cp.y+Math.sin(a)*24)));
          entry.marker.setStyle?.({radius:12});
        });
      });
      c.markers.forEach(({marker})=>{
        const pop=marker.getPopup?.();
        if(pop){pop.options.maxWidth=240;pop.options.minWidth=210;pop.options.autoPan=true;pop.options.keepInView=true;pop.options.autoPanPaddingTopLeft=L.point(36,36);pop.options.autoPanPaddingBottomRight=L.point(36,36)}
      });
      map.on('popupopen',e=>{
        const popup=e.popup,el=popup.getElement();
        if(!el)return;
        requestAnimationFrame(()=>{
          const box=map.getContainer().getBoundingClientRect(),r=el.getBoundingClientRect(),pad=20;
          let dx=0,dy=0;
          if(r.right>box.right-pad)dx=r.right-box.right+pad;
          if(r.left<box.left+pad)dx=r.left-box.left-pad;
          if(r.top<box.top+pad)dy=r.top-box.top-pad;
          if(r.bottom>box.bottom-pad)dy=r.bottom-box.bottom+pad;
          if(dx||dy)map.panBy([dx,dy],{animate:false});
        });
      });
    },100);
  };
  document.head.insertAdjacentHTML('beforeend',`<style>@media(max-width:700px),(pointer:coarse){.leaflet-popup{width:240px!important;max-width:calc(100% - 40px)!important}.leaflet-popup-content-wrapper{width:240px!important;max-width:calc(100vw - 52px)!important}.leaflet-popup-content{width:auto!important;max-width:none!important;margin:10px 12px!important}.leaflet-popup-content .pinactions button,.leaflet-popup-content .pinopen,.leaflet-popup-content .pincompare{white-space:nowrap!important;width:100%!important}}</style>`);
})();
'''
          p.write_text(s)
          PY
      - name: Commit direct app fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix mobile map popup and overlapping markers in app"
          git push
