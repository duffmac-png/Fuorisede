<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FUORISEDE · Confronto operativo</title><style>:root{--bg:#f7f6f2;--paper:#fff;--ink:#171715;--muted:#77736c;--accent:#a54c3e;--line:#e9e6df;--green:#356b58;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}.shell{max-width:1120px;margin:auto;padding:0 22px 80px}.header{height:78px;display:flex;align-items:center;justify-content:space-between}.header img{width:132px;cursor:pointer}.back{font-size:12px;color:var(--muted);cursor:pointer}.intro{padding:35px 0 25px}.intro h1{font-size:clamp(40px,6vw,65px);line-height:1;letter-spacing:-.06em;margin:8px 0}.intro p{font-size:13px;color:var(--muted)}.empty{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px}.empty button,.clear{border:0;border-radius:999px;background:var(--ink);color:#fff;padding:12px 18px;font-weight:800;cursor:pointer}.compare{display:grid;border-top:1px solid var(--line)}.cell{padding:15px 12px;border-bottom:1px solid var(--line);min-width:0}.label{font-size:9px;text-transform:uppercase;color:var(--muted)}.photo{height:140px;border-radius:16px;background:#e1dcd3;background-size:cover;background-position:center;display:grid;place-items:center;text-align:center;padding:15px;font-size:10px;color:var(--muted)}.home b{display:block;font-size:14px;margin-top:10px}.home span{font-size:9px;color:var(--muted)}.open{display:block;margin-top:7px!important;color:var(--accent)!important;font-weight:800;cursor:pointer}.sectiontitle{grid-column:1/-1;padding:26px 0 9px;font-size:18px;font-weight:800;border-bottom:1px solid var(--line)}.value{font-size:12px;font-weight:700}.quiet{color:var(--muted)}.award{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:4px 7px;border-radius:999px;background:#e7f0eb;color:var(--green);font-size:8px;font-weight:850}.award .ico{font-size:12px}.actions{margin-top:25px;display:flex;gap:10px}@media(max-width:700px){.shell{padding:0 10px 60px}.header{height:62px}.cell{padding:10px 4px}.photo{height:82px;border-radius:10px;font-size:7px}.home b{font-size:10px}.home span{font-size:7px}.value{font-size:9px}.label{font-size:7px}}</style></head><body><main class="shell"><header class="header"><img src="../fuorisede-logo-approved-transparent.png" alt="FUORISEDE" onclick="location.href='operativa.html'"><div class="back" onclick="location.href='operativa.html'">← Torna agli alloggi</div></header><section class="intro"><div class="label">Ferrara · confronto operativo</div><h1 id="heading">Confronta.</h1><p>Il confronto mostra solo gli alloggi che hai selezionato. Puoi confrontarne 2 o 3.</p></section><div id="app"></div></main><script>const D={301:{n:'Le Corti di Medoro',p:'€429',sub:'oneri compresi',av:'Da verificare',polo:'Mammuth',wifi:'Sì',bath:'Da verificare',laundry:'Da verificare',dep:'Da verificare',src:'ACER Ferrara',photo:null},302:{n:'Putinati 149',p:'da €330',sub:'altri costi da verificare',av:'Da verificare',polo:'Mammuth',wifi:'Sì',bath:'Privato',laundry:'Sì',dep:'3 mensilità',src:'ACER Ferrara',photo:null},303:{n:'Via Giuoco del Pallone',p:'da €600',sub:'utenze escluse',av:'Disponibile ora',polo:'Centro',wifi:'Sì',bath:'Privato finestrato',laundry:'Lavatrice',dep:'3 mensilità',src:'Offerente diretto',photo:'../assets/listings/orlandini-soggiorno.jpeg'},304:{n:'Appartamento · zona Mammut',p:'Da definire',sub:'dato da acquisire',av:'Da fine novembre 2026',polo:'Mammut',wifi:'Da verificare',bath:'Da verificare',laundry:'Da verificare',dep:'Da verificare',src:'Roberto Spagnolo · inserimento autorizzato',photo:null}};let ids=JSON.parse(localStorage.getItem('fs-operativa-compare')||'[]').filter(x=>D[x]).slice(0,3);if(ids.length<2){app.innerHTML='<div class="empty"><b>Nessun confronto ancora pronto.</b><p>Seleziona almeno due alloggi dalla home o dalle rispettive schede con “Aggiungi al confronto”.</p><button onclick="location.href=\'operativa.html\'">Scegli gli alloggi</button></div>'}else{heading.innerHTML=ids.length===2?'Due case.<br>Una scelta.':'Tre case.<br>Una scelta.';const cols=`140px repeat(${ids.length},minmax(0,1fr))`;const row=(label,key,award)=>`<div class="cell label">${label}</div>`+ids.map(id=>`<div class="cell value ${D[id][key].includes('verific')?'quiet':''}">${D[id][key]}${award&&award(id)?`<br><span class="award"><span class="ico">${award(id)[0]}</span>${award(id)[1]}</span>`:''}</div>`).join('');app.innerHTML=`<section class="compare" style="grid-template-columns:${cols}"><div class="cell"></div>${ids.map(id=>`<div class="cell home"><div class="photo" ${D[id].photo?`style="background-image:url('${D[id].photo}')"`:''}>${D[id].photo?'':'Foto non ancora disponibili'}</div><b>${D[id].n}</b><span>${D[id].p}</span><span class="open" onclick="location.href='listing-operativa.html?id=${id}'">Apri scheda →</span></div>`).join('')}<div class="sectiontitle">Quello che conta subito</div>${row('Costo noto','p',id=>id===302?['★','Costo più basso']:null)}${row('Disponibilità','av',id=>id===303?['✓','Disponibile ora']:null)}${row('Polo','polo',id=>null)}<div class="sectiontitle">Dotazioni</div>${row('Wi-Fi','wifi',id=>['✓','Presente'])}${row('Bagno','bath',id=>id===303?['✦','Plus']:null)}${row('Lavanderia','laundry',id=>null)}<div class="sectiontitle">Contratto e verifica</div>${row('Deposito','dep',id=>null)}${row('Fonte','src',id=>null)}</section><div class="actions"><button class="clear" onclick="localStorage.removeItem('fs-operativa-compare');location.reload()">Azzera confronto</button></div>`}</script></body></html>
