<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FUORISEDE · Preferiti operativi</title><style>:root{--bg:#f7f6f2;--paper:#fff;--ink:#171715;--muted:#77736c;--accent:#a54c3e;--line:#e9e6df;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}a{color:inherit;text-decoration:none}.shell{max-width:1120px;margin:auto;padding:0 22px 90px}.header{height:78px;display:flex;align-items:center;justify-content:space-between}.brand img{width:132px;display:block}.nav{display:flex;gap:8px;font-size:12px}.nav a{padding:10px 13px}.nav .active{font-weight:800;color:var(--accent)}.intro{padding:36px 0 26px}.intro h1{font-size:clamp(42px,7vw,70px);line-height:1;letter-spacing:-.06em;margin:8px 0}.intro p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px;position:relative;cursor:pointer}.card h2{font-size:21px;margin:5px 42px 7px 0}.card p{font-size:12px;color:var(--muted);margin:0 0 12px}.card strong{font-size:15px}.heart{position:absolute;right:16px;top:16px;border:0;background:#f3eee7;color:var(--accent);width:36px;height:36px;border-radius:50%;font-size:19px;cursor:pointer}.empty{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px}.empty button{border:0;border-radius:999px;background:var(--ink);color:#fff;padding:12px 18px;font-weight:800;cursor:pointer}@media(max-width:650px){.shell{padding:0 15px 70px}.header{height:auto;padding:16px 0;align-items:flex-start}.nav{flex-wrap:wrap;justify-content:flex-end}.grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><header class="header"><a class="brand" href="operativa.html"><img src="../fuorisede-logo-approved-transparent.png" alt="FUORISEDE"></a><nav class="nav"><a href="operativa.html">Alloggi</a><a href="map-operativa.html">Mappa</a><a href="compare-operativa.html">Confronta</a><a class="active" href="favorites-operativa.html">Preferiti</a></nav></header><section class="intro"><div>Ferrara · selezione personale</div><h1>I tuoi preferiti.</h1><p>Gli alloggi salvati in questo browser, separati dal confronto.</p></section><section id="app"></section></main><script>const D={301:{n:'Le Corti di Medoro · posto letto singolo',p:'€429 / mese',l:'Le Corti di Medoro · Ferrara'},302:{n:'Via Comacchio / Putinati 149',p:'da €330 / mese',l:'Ferrara · zona Mammut'},303:{n:'Bilocale Via Giuoco del Pallone',p:'da €600 / mese',l:'Ferrara · centro'},304:{n:'Appartamento · zona Mammut',p:'Da definire',l:'Ferrara · zona Mammut'}};const KEY='fs-operativa-favorites';function ids(){try{return JSON.parse(localStorage.getItem(KEY)||'[]').filter(x=>D[x])}catch(e){return[]}}function removeFav(e,id){e.stopPropagation();localStorage.setItem(KEY,JSON.stringify(ids().filter(x=>x!==id)));render()}function render(){const a=ids();app.innerHTML=a.length?'<div class="grid">'+a.map(id=>`<article class="card" onclick="location.href='listing-operativa.html?id=${id}'"><button class="heart" aria-label="Rimuovi dai preferiti" onclick="removeFav(event,${id})">♥</button><h2>${D[id].n}</h2><p>${D[id].l}</p><strong>${D[id].p}</strong></article>`).join('')+'</div>':'<div class="empty"><b>Nessun preferito salvato.</b><p>Usa il cuore sulle schede per ritrovarle qui.</p><button onclick="location.href=\'operativa.html\'">Vedi gli alloggi</button></div>'}render();</script></body></html>
