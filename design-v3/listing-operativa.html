<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FUORISEDE · Scheda operativa</title><style>:root{--bg:#f7f6f2;--paper:#fff;--ink:#171715;--muted:#77736c;--accent:#a54c3e;--line:#e9e6df;--green:#356b58;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.shell{max-width:1080px;margin:auto;padding:0 22px 90px}.header{height:78px;display:flex;align-items:center;justify-content:space-between}.header img{width:132px}.back{font-size:12px;color:var(--muted);cursor:pointer}.gallery{display:grid;grid-template-columns:1.65fr .85fr;grid-template-rows:210px 210px;gap:10px}.photo{background:#e4dfd6;background-size:cover;background-position:center;border-radius:18px}.photo.main{grid-row:1/3}.placeholder{grid-column:1/-1;grid-row:1/3;display:grid;place-items:center;text-align:center;background:#e4dfd6;border-radius:24px;padding:30px}.placeholder div{max-width:430px}.placeholder b{display:block;font-size:25px;margin-bottom:10px}.placeholder p{font-size:13px;color:var(--muted);line-height:1.55}.layout{display:grid;grid-template-columns:1fr 310px;gap:60px;padding-top:38px}.kicker{font-size:11px;color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.07em}.title{font-size:clamp(36px,5vw,58px);line-height:1;letter-spacing:-.055em;margin:10px 0}.place{color:var(--muted);font-size:13px}.section{padding:26px 0;border-bottom:1px solid var(--line)}.section h2{font-size:21px;margin:0 0 14px}.section p{color:#5e5b56;line-height:1.65;font-size:14px}.features{display:grid;grid-template-columns:1fr 1fr;gap:10px 25px}.feature{padding:9px 0;border-bottom:1px solid #eeeae3;font-size:12px}.verify{border:0;background:none;color:var(--accent);font-size:10px;font-weight:800;padding:4px 0;margin-left:5px}.maplink{color:var(--accent);font-weight:800;cursor:pointer}.aside{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;height:max-content;position:sticky;top:20px}.price{font-size:34px;font-weight:850}.available{margin:12px 0;color:var(--green);font-size:12px;font-weight:800}.cta,.secondary{width:100%;border-radius:14px;padding:13px;font-weight:750;margin-top:8px}.cta{border:0;background:var(--ink);color:#fff}.secondary{border:1px solid var(--line);background:#fff}.fine{font-size:9px;color:var(--muted);line-height:1.5;margin-top:12px}@media(max-width:760px){.shell{padding:0 15px 70px}.header{height:62px}.gallery{margin:0 -15px;display:block}.photo{display:none;border-radius:0}.photo.main{display:block;height:360px}.placeholder{height:360px;border-radius:0}.layout{display:block;padding-top:25px}.aside{position:static;margin-top:25px}.features{grid-template-columns:1fr}.title{font-size:39px}}</style></head><body><main class="shell"><header class="header"><img src="../fuorisede-logo-approved-transparent.png" alt="FUORISEDE"><div class="back" onclick="location.href='operativa.html'">← Tutti gli alloggi</div></header><section id="gallery" class="gallery"></section><section class="layout"><article><div class="kicker" id="source"></div><h1 class="title" id="title"></h1><div class="place" id="address"></div><section class="section"><h2>L'alloggio</h2><p id="description"></p><div class="features" id="features"></div></section><section class="section"><h2>Informazioni da verificare</h2><div class="features" id="details"></div></section></article><aside class="aside"><div class="price" id="price"></div><div class="available" id="availability"></div><button class="cta" id="contact">Mi interessa / contatta referente</button><button class="secondary" onclick="toggleCompare()" id="compareBtn">Aggiungi al confronto</button><button class="secondary" onclick="location.href='operativa.html'">Torna agli alloggi</button><div class="fine" id="fine"></div></aside></section></main><script>const DATA={301:{title:'Le Corti di Medoro · posto letto singolo',address:'Le Corti di Medoro · Ferrara',price:'€429 / mese',availability:'Disponibilità da verificare',source:'ACER Ferrara · collaudo',description:'Alloggio per studenti nella residenza Le Corti di Medoro. Appartamenti arredati in classe energetica A, Wi-Fi e linea bus 11.',features:['Posto letto singolo','Appartamenti ammobiliati','Classe energetica A','Wi-Fi','Linea bus 11'],details:['Canone e oneri accessori compresi','Contratto: requisiti e assegnazione da verificare','Deposito: da verificare','Bagno: da verificare'],photos:[],fine:'Scheda autorizzata al collaudo. Prima del rilascio pubblico sono richieste revisione ACER e verifica disponibilità.'},302:{title:'Residenza Putinati 149 · stanza singola',address:'Via Putinati 149 · Ferrara',price:'da €330 / mese',availability:'Disponibilità da verificare',source:'ACER Ferrara · collaudo',description:'Camera singola arredata con balcone e bagno privato. Sale studio, cucine comuni, lavanderia, deposito biciclette e Wi-Fi gratuito.',features:['Bagno privato','Balcone','Wi-Fi gratuito','Lavanderia','Sale studio','Cucine comuni'],details:['Eventuali ulteriori costi da verificare','Contratto: requisiti e assegnazione da verificare','Deposito: 3 mensilità','Due ascensori'],photos:[],fine:'Scheda autorizzata al collaudo. Disponibilità e costi ulteriori devono essere ricontrollati.'},303:{title:'Bilocale · Via Giuoco del Pallone',address:'Via Giuoco del Pallone · Ferrara',price:'da €600 / mese',availability:'Disponibile ora',source:'Offerente diretto',description:'Ampio bilocale nel centro storico con soggiorno e zona pranzo, cucina separata finestrata, camera matrimoniale e bagno privato finestrato.',features:['Arredato','Wi-Fi','Lavatrice','Riscaldamento a gas','Bagno privato finestrato','Cucina separata'],details:['Nessuna spesa condominiale; utenze escluse','Durata minima annuale','Deposito: 3 mensilità','Senza ascensore'],photos:['../assets/listings/orlandini-soggiorno.jpeg','../assets/listings/orlandini-interno-2.jpeg','../assets/listings/orlandini-interno-3.jpeg'],fine:'Fotografie autorizzate dall’offerente. I recapiti personali non vengono pubblicati senza conferma specifica.'}};const id=new URLSearchParams(location.search).get('id')||'301',d=DATA[id]||DATA[301];title.textContent=d.title;address.textContent=d.address;price.textContent=d.price;availability.textContent=d.availability;source.textContent=d.source;description.textContent=d.description;fine.textContent=d.fine;features.innerHTML=d.features.map(x=>'<div class="feature">✓ '+(x==='Linea bus 11'?x+' · <span class="maplink" onclick="location.href=\'map.html?mode=operativa&focus=301\'">vedi sulla mappa ↗</span>':x)+'</div>').join('');details.innerHTML=d.details.map(x=>'<div class="feature">'+x+(x.toLowerCase().includes('verific')?' <button class="verify" onclick="requestVerify(this)">Richiedi verifica</button>':'')+'</div>').join('');if(d.photos.length){gallery.innerHTML=d.photos.map((p,i)=>`<div class="photo ${i===0?'main':''}" style="background-image:url('${p}')"></div>`).join('')}else{gallery.innerHTML='<div class="placeholder"><div><b>Foto non ancora disponibili</b><p>Puoi richiedere le foto originali o un’integrazione al referente.</p><button class="secondary" onclick="document.getElementById(\'contact\').click()">Richiedi foto / contatta referente</button></div></div>'}function requestVerify(b){b.textContent='Verifica richiesta ✓';b.disabled=true}contact.onclick=()=>alert('Richiesta registrata per il collaudo. Il contatto diretto verrà attivato quando il recapito autorizzato sarà disponibile.');function toggleCompare(){let a=JSON.parse(localStorage.getItem('fs-operativa-compare')||'[]');const n=Number(id),i=a.indexOf(n);i>=0?a.splice(i,1):a.length<3&&a.push(n);localStorage.setItem('fs-operativa-compare',JSON.stringify(a));compareBtn.textContent=a.includes(n)?'✓ Selezionato per confronto':'Aggiungi al confronto';if(a.length>=2)compareBtn.textContent+=' · apri confronto';if(a.length>=2)compareBtn.onclick=()=>location.href='compare-operativa.html'}toggleCompareState=()=>{let a=JSON.parse(localStorage.getItem('fs-operativa-compare')||'[]');if(a.includes(Number(id)))compareBtn.textContent='✓ Selezionato per confronto'};toggleCompareState();</script></body></html>
