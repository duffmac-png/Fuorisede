<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>FUORISEDE · Test JSON Phosphoro</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{font-family:Inter,system-ui,sans-serif;color:#171715;background:#f8f9f7}*{box-sizing:border-box}body{margin:0}.top{padding:18px 22px;border-bottom:1px solid #e5e3dc;background:#fff}.top img{width:min(230px,55vw)}main{max-width:950px;margin:auto;padding:26px 18px 70px}.pilot{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#777}.card{margin-top:16px;background:#fff;border:1px solid #e5e3dc;border-radius:24px;overflow:hidden}.hero{height:390px;background:#eee center/cover no-repeat}.body{padding:22px}.eyebrow{font-size:11px;text-transform:uppercase;color:#777;font-weight:800}.title{font-size:30px;line-height:1.05;margin:8px 0}.price{font-size:30px;font-weight:900}.price small{font-size:13px;font-weight:500;color:#777}.badges{margin:12px 0}.badge{display:inline-block;margin:4px 4px 0 0;padding:7px 10px;border-radius:999px;background:#eef4ef;font-size:11px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.box{border:1px solid #e5e3dc;border-radius:16px;padding:14px}.box small{display:block;color:#777;margin-bottom:5px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.gallery img{width:100%;height:150px;object-fit:cover;border-radius:12px}.map{height:320px;margin-top:18px;border-radius:18px;overflow:hidden}.source{margin-top:18px;padding:13px;border-radius:14px;background:#f1f1ed;font-size:12px}.error{padding:25px;background:#fff3f0;border-radius:18px}@media(max-width:650px){.hero{height:280px}.grid{grid-template-columns:1fr}.gallery{display:flex;overflow:auto}.gallery img{min-width:75%;height:190px}.title{font-size:25px}}</style></head><body><header class="top"><img src="https://fuorisede-demo.vercel.app/fuorisede-logo-approved-transparent.png" alt="FUORISEDE"></header><main><div class="pilot">Test tecnico isolato · JSON Phosphoro / PH4YOU · non indicizzato</div><div id="root">Caricamento JSON…</div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const euro=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
fetch('/data/phosphoro-pilot-sample.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(items=>{const x=items[0];document.getElementById('root').innerHTML=`<article class="card"><div class="hero" style="background-image:url('${x.photos[0]}')"></div><div class="body"><div class="eyebrow">${x.city} · ${x.publication.source}</div><h1 class="title">${x.title}</h1><div class="price">${euro(x.price)} <small>/ mese + ${euro(x.expenses)} spese</small></div><div class="badges">${x.features.map(f=>`<span class="badge">${f}</span>`).join('')}</div><p>${x.details.description}</p><div class="grid"><div class="box"><small>Costo reale mensile</small><b>${euro(x.realMonthlyCost)}</b></div><div class="box"><small>Deposito</small><b>${x.details.deposit}</b></div><div class="box"><small>Contratto</small><b>${x.details.contract}</b></div><div class="box"><small>Disponibilità</small><b>${x.availability.availableLabel}</b></div><div class="box"><small>Superficie stanza</small><b>${x.partner.roomSquareMetres} m²</b></div><div class="box"><small>Classe energetica</small><b>${x.partner.energyClass}</b></div></div><div class="gallery">${x.photos.slice(1).map(p=>`<img src="${p}" alt="Foto stanza Phosphoro">`).join('')}</div><div id="map" class="map"></div><div class="source">Record partner ${x.externalId} · immobile ${x.partner.propertyId} · stanza ${x.partner.roomId}. Questa pagina serve esclusivamente a verificare il mapping del JSON prima del pilot Ferrara.</div></div></article>`;const map=L.map('map',{scrollWheelZoom:false}).setView([x.lat,x.lng],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);L.marker([x.lat,x.lng]).addTo(map).bindPopup(`<b>${x.title}</b><br>${euro(x.price)} / mese`).openPopup()}).catch(e=>document.getElementById('root').innerHTML=`<div class="error"><b>Test non caricato.</b><br>${e.message}</div>`);
</script></body></html>
